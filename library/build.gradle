import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "org.jetbrains.kotlin.jvm"
    id "com.google.devtools.ksp"

    id "java-library"
    id "maven-publish"

    id "jacoco"
    id "io.gitlab.arturbosch.detekt"
    id "org.jlleitschuh.gradle.ktlint"
}

apply from: "${rootDir}/gradle/dependencies.gradle"

java {
    withSourcesJar()
    withJavadocJar()
}

kotlin {
    jvmToolchain(17)

    compilerOptions {
        jvmTarget = JvmTarget.JVM_1_8
        freeCompilerArgs.addAll("-Xjsr305=strict", "-Xannotation-default-target=param-property")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

// Generates the BuildConfig with the library version, which is used for the default user agent.
def generatedBuildConfigDir = layout.buildDirectory.dir("generated/buildconfig")

def generateBuildConfig = tasks.register("generateBuildConfig") {
    def version = project.version.toString()
    def outputDir = generatedBuildConfigDir

    inputs.property("version", version)
    outputs.dir(outputDir)

    doLast {
        def file = outputDir.get().file("me/proxer/library/BuildConfig.kt").asFile

        file.parentFile.mkdirs()
        file.text = """package me.proxer.library

internal object BuildConfig {
    const val VERSION = "$version"
}
"""
    }
}

sourceSets.main.kotlin.srcDir(generateBuildConfig)

tasks.named("test") {
    finalizedBy "jacocoTestReport"

    useJUnitPlatform()
}

jacoco {
    toolVersion = jacocoVersion
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = false
    }
}

ktlint {
    version = ktlintVersion

    // The code base predates the current ktlint rule set, so findings are reported but don't fail the build.
    ignoreFailures = true

    filter {
        exclude { it.file.path.contains("/build/") }
    }

    reporters {
        reporter "checkstyle"
    }
}

detekt {
    toolVersion = detektVersion
    buildUponDefaultConfig = true

    config.setFrom(files("$rootDir/config/detekt.yml"))
    baseline = file("$projectDir/detekt-baseline.xml")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "ProxerLibJava"

            from components.java

            pom {
                name = "ProxerLibJava"
                description = "A JVM and Android library, implementing the API of the Proxer.Me website"
                url = "https://github.com/MrP1ck/ProxerLibJava"

                scm {
                    url = "https://github.com/MrP1ck/ProxerLibJava"
                    connection = "scm:git:https://github.com/MrP1ck/ProxerLibJava"
                    developerConnection = "scm:git:git@github.com/MrP1ck/ProxerLibJava"
                    tag = "HEAD"
                }

                issueManagement {
                    system = "GitHub Issues"
                    url = "https://github.com/MrP1ck/ProxerLibJava/issues"
                }

                licenses {
                    license {
                        name = "MIT"
                        url = "https://opensource.org/licenses/MIT"
                        distribution = "repo"
                    }
                }
            }
        }
    }
}
